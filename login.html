<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#090A14',
                            card: '#111222',
                            border: '#1C1F3A',
                            muted: '#3A3D5C',
                        },
                        primary: '#DF6B33',
                        'primary-hover': '#C85C28',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #090A14; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #090A14; }
        ::-webkit-scrollbar-thumb { background: #1C1F3A; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #DF6B33; }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #E2E4E8;
            -webkit-box-shadow: 0 0 0px 1000px #111222 inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        .input-error { border-color: #EF4444 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important; }
        .input-success { border-color: #22C55E !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8 font-inter">

    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-20%] left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-primary/3 rounded-full blur-[100px]"></div>
    </div>

    <div class="relative w-full max-w-[440px]">

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary/10 border border-primary/20 mb-4">
                <i data-lucide="shield-check" class="w-7 h-7 text-primary"></i>
            </div>
            <h1 class="font-poppins font-extrabold text-2xl text-white mb-1">Welcome Back</h1>
            <p class="font-inter text-sm text-gray-400">Sign in to your account to continue</p>
        </div>

        <div class="bg-dark-card border border-dark-border rounded-2xl p-6 sm:p-8 shadow-2xl shadow-black/50">

            <form id="loginForm" class="space-y-5">

                <div>
                    <label for="email" class="block font-inter text-sm font-medium text-gray-300 mb-2">
                        Email Address
                    </label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input
                            id="email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            class="w-full pl-11 pr-4 py-3 bg-dark-bg border border-dark-border rounded-xl text-gray-200 font-inter text-sm placeholder:text-gray-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 transition-all duration-200"
                        >
                    </div>
                    <p id="emailError" class="hidden mt-1.5 flex items-center gap-1.5 font-inter text-xs text-red-400">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0"></i>
                        <span></span>
                    </p>
                </div>

                <div>
                    <label for="password" class="block font-inter text-sm font-medium text-gray-300 mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input
                            id="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            class="w-full pl-11 pr-12 py-3 bg-dark-bg border border-dark-border rounded-xl text-gray-200 font-inter text-sm placeholder:text-gray-600 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 transition-all duration-200"
                        >
                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition-colors duration-200"
                        >
                            <i data-lucide="eye" class="w-4 h-4" id="eyeIcon"></i>
                        </button>
                    </div>
                    <p id="passwordError" class="hidden mt-1.5 flex items-center gap-1.5 font-inter text-xs text-red-400">
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0"></i>
                        <span></span>
                    </p>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2.5 cursor-pointer select-none group">
                        <div class="relative">
                            <input type="checkbox" id="remember" class="sr-only peer">
                            <div class="w-5 h-5 border-2 border-dark-muted rounded-md peer-checked:bg-primary peer-checked:border-primary transition-all duration-200 peer-hover:border-primary/70 flex items-center justify-center overflow-hidden">
                                <i data-lucide="check" class="w-3 h-3 text-white translate-y-5 peer-checked:translate-y-0 transition-all duration-200"></i>
                            </div>
                        </div>
                        <span class="font-inter text-sm text-gray-400 group-hover:text-gray-300 transition-colors duration-200">Remember me</span>
                    </label>
                    <a href="#" class="font-inter text-sm text-primary hover:text-primary-hover transition-colors duration-200">Forgot password?</a>
                </div>

                <button
                    type="submit"
                    class="w-full py-3 bg-primary hover:bg-primary-hover text-white font-poppins font-semibold text-sm rounded-xl transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.98] cursor-pointer"
                >
                    Sign In
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>

            </form>

            <div class="flex items-center gap-3 my-6">
                <div class="flex-1 h-px bg-dark-border"></div>
                <span class="font-inter text-xs text-gray-600">or continue with</span>
                <div class="flex-1 h-px bg-dark-border"></div>
            </div>

            <div class="grid grid-cols-3 gap-3">

                <button class="flex items-center justify-center gap-2 py-3 px-2 bg-dark-bg border border-dark-border rounded-xl hover:border-primary/40 hover:bg-dark-border/30 transition-all duration-200 group cursor-pointer">
                    <i data-lucide="chrome" class="w-5 h-5 text-gray-400 group-hover:text-primary transition-colors duration-200"></i>
                    <span class="font-inter text-xs text-gray-400 group-hover:text-gray-200 transition-colors duration-200 hidden sm:block">Google</span>
                </button>

                <button class="flex items-center justify-center gap-2 py-3 px-2 bg-dark-bg border border-dark-border rounded-xl hover:border-primary/40 hover:bg-dark-border/30 transition-all duration-200 group cursor-pointer">
                    <i data-lucide="github" class="w-5 h-5 text-gray-400 group-hover:text-white transition-colors duration-200"></i>
                    <span class="font-inter text-xs text-gray-400 group-hover:text-gray-200 transition-colors duration-200 hidden sm:block">GitHub</span>
                </button>

                <button class="flex items-center justify-center gap-2 py-3 px-2 bg-dark-bg border border-dark-border rounded-xl hover:border-primary/40 hover:bg-dark-border/30 transition-all duration-200 group cursor-pointer">
                    <i data-lucide="facebook" class="w-5 h-5 text-gray-400 group-hover:text-blue-400 transition-colors duration-200"></i>
                    <span class="font-inter text-xs text-gray-400 group-hover:text-gray-200 transition-colors duration-200 hidden sm:block">Facebook</span>
                </button>

            </div>

        </div>

        <p class="text-center mt-6 font-inter text-sm text-gray-500">
            Don't have an account?
            <a href="register.html" class="text-primary hover:text-primary-hover transition-colors duration-200 font-medium">Sign up</a>
        </p>

    </div>

    <script>
        lucide.createIcons();

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const toggleBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function showError(input, errorEl, message) {
            input.classList.add('input-error');
            input.classList.remove('input-success');
            errorEl.querySelector('span').textContent = message;
            errorEl.classList.remove('hidden');
        }

        function clearError(input, errorEl) {
            input.classList.remove('input-error');
            input.classList.remove('input-success');
            errorEl.classList.add('hidden');
        }

        function validateEmail() {
            const value = emailInput.value.trim();
            if (!value) {
                showError(emailInput, emailError, 'Email is required');
                return false;
            }
            if (!emailRegex.test(value)) {
                showError(emailInput, emailError, 'Invalid email address');
                return false;
            }
            clearError(emailInput, emailError);
            emailInput.classList.add('input-success');
            return true;
        }

        function validatePassword() {
            const value = passwordInput.value;
            if (!value) {
                showError(passwordInput, passwordError, 'Password is required');
                return false;
            }
            clearError(passwordInput, passwordError);
            return true;
        }

        emailInput.addEventListener('blur', validateEmail);
        emailInput.addEventListener('input', () => {
            if (emailInput.classList.contains('input-error')) validateEmail();
        });

        passwordInput.addEventListener('blur', validatePassword);
        passwordInput.addEventListener('input', () => {
            if (passwordInput.classList.contains('input-error')) validatePassword();
        });

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
            lucide.createIcons();
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const emailOk = validateEmail();
            const passwordOk = validatePassword();
            if (!emailOk || !passwordOk) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const remember = document.getElementById('remember').checked;
            console.log({ email, password, remember });
            alert('Login successful!');
        });
    </script>

</body>
</html>
